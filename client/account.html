<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Account Settings</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/account.js" defer></script>
</head>

<body>
    <main class="container">
        <section class="account-card">
            <h1>Account Settings</h1>
            <p><strong>Name:</strong> <span id="account-name">Loading...</span></p>
            <p><strong>Email:</strong> <span id="account-email">Loading...</span></p>
            <p><strong>Role:</strong> <span id="account-role">Loading...</span></p>

            <button id="delete-account" class="danger">
                Delete Account
            </button>

            <p id="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
